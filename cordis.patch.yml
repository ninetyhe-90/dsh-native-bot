# 把桌宠挂到 DSH 上。桌宠只能这样启动，DSH 退出它就跟着退出。
#
# 临时启用（在项目目录）：
#   npm start
#   等价于 dsh web --patch /Users/ninetyhehe/WebstormProjects/dsh-native-bot/cordis.patch.yml
#
# 永久启用：把下面这段追加到 $DSH_HOME/profiles/<profile>/cordis.patch.yml，之后 dsh web 就会带上桌宠。
- insert:
    - id: desk-pet
      name: /Users/ninetyhehe/WebstormProjects/dsh-native-bot/plugin/desk-pet.mjs
